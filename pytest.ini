[pytest]
addopts = -ra --tb=short --alluredir=allure-results --reruns 2 --reruns-delay 3
testpaths = tests
markers =
    smoke: quick sanity checks
    account: registration/login/logout/account management
    cart: shopping cart behaviour
    checkout: checkout & order placement
    products: product listing/search/detail/category/brand
    misc: contact us, subscription, scroll, static pages
base_url = https://www.automationexercise.com
